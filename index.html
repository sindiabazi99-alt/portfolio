<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="theme-color" content="#f1f1ef" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sindi-abazi.vercel.app/" />
    <meta property="og:image" content="%SHARE_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="loader" aria-hidden="true">
      <div class="loader-mark">%NAME%</div>
      <div class="loader-count"><span id="loader-num">000</span></div>
    </div>

    <main id="stage" aria-label="Works">
      <div id="world">
        <div id="label"><span id="label-text">%NAME%</span><sup id="label-count"></sup></div>
      </div>
    </main>

    <header class="top">
      <div class="id">
        <a class="brand" href="#/" aria-label="%NAME% — home">%NAME%</a>
        <p class="tag">%TAGLINE%</p>
      </div>
      <nav class="cats" id="cats" aria-label="Categories"></nav>
      <button class="link info-btn" id="info-btn">Info</button>
    </header>

    <footer class="bottom">
      <div class="views" id="views" role="tablist" aria-label="View">
        <button data-mode="sphere" role="tab">Sphere</button>
        <button data-mode="grid" role="tab">Grid</button>
        <button data-mode="index" role="tab">Index</button>
      </div>
      <div class="status" id="status">Drag to rotate</div>
      <div class="copy">©&nbsp;<span id="year"></span>&nbsp;%NAME%</div>
    </footer>

    <section id="index" aria-label="Project index"><ol id="index-list"></ol></section>
    <div id="peek" aria-hidden="true"><img alt="" /></div>

    <div id="cursor" aria-hidden="true"><span class="dot"></span><span class="pill" id="cursor-pill"></span></div>

    <article id="viewer" aria-hidden="true"></article>

    <section id="info" aria-hidden="true">
      <button class="link close" data-close>Close</button>
      <div class="info-inner">
        <p class="info-lead">%BIO%</p>
        <div class="info-cols">
          <div>
            <h3>Worked on</h3>
            <ul id="clients"></ul>
          </div>
          <div>
            <h3>Disciplines</h3>
            <ul id="disciplines"></ul>
          </div>
          <div>
            <h3>Contact</h3>
            <ul id="contact"></ul>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
