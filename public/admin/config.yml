# Configurazione del CMS (Sveltia CMS) — https://sveltiacms.app/en/docs
backend:
  name: github
  repo: sindiabazi99-alt/portfolio
  branch: main
  commit_messages:
    create: "CMS: nuovo {{collection}} “{{slug}}”"
    update: "CMS: aggiorna {{collection}} “{{slug}}”"
    delete: "CMS: elimina {{collection}} “{{slug}}”"
    uploadMedia: "CMS: carica “{{path}}”"
    deleteMedia: "CMS: elimina “{{path}}”"

site_url: https://sindi-abazi.vercel.app
display_url: https://sindi-abazi.vercel.app
locale: it

media_folder: /public/uploads
public_folder: /uploads

# le foto caricate vengono convertite in WebP e ridotte a max 2400px
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

collections:
  - name: projects
    label: Progetti
    label_singular: Progetto
    description: >-
      Ogni progetto è una scheda con titolo, categoria e galleria.
      Il numero "Ordine" decide la posizione sul sito (più basso = prima).
    folder: content/projects
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{order}} · {{title}} — {{category}}"
    sortable_fields:
      fields: [order, title, category]
      default:
        field: order
        direction: ascending
    view_filters:
      - label: Covers
        field: category
        pattern: covers
      - label: Storyboards
        field: category
        pattern: storyboards
      - label: Comics
        field: category
        pattern: comics
      - label: Concept Art
        field: category
        pattern: concept
      - label: Illustration
        field: category
        pattern: illustration
      - label: Nascosti
        field: hidden
        pattern: true
    fields:
      - name: title
        label: Titolo
        widget: string
      - name: order
        label: Ordine
        widget: number
        value_type: int
        default: 999
        hint: Posizione nell'elenco (10, 20, 30…). Più basso = più in alto.
      - name: category
        label: Categoria
        widget: select
        options:
          - { label: Covers, value: covers }
          - { label: Storyboards, value: storyboards }
          - { label: Comics, value: comics }
          - { label: Concept Art, value: concept }
          - { label: Illustration, value: illustration }
      - name: type
        label: Tipo (tag)
        widget: string
        required: false
        hint: "Es. Storyboard, Album Cover, Comic — Unreleased"
      - name: client
        label: Cliente
        widget: string
        required: false
      - name: year
        label: Anno
        widget: string
        required: false
      - name: description
        label: Descrizione
        widget: text
        required: false
      - name: images
        label: Immagini
        widget: image
        multiple: true
        min: 1
        hint: >-
          Puoi caricarne tante insieme. Trascina per cambiare l'ordine:
          le prime 8 compaiono nella sfera della home.
      - name: hidden
        label: Nascondi dal sito
        widget: boolean
        default: false
        required: false

  - name: settings
    label: Impostazioni sito
    files:
      - name: settings
        label: Testi, contatti e SEO
        file: content/settings.json
        format: json
        fields:
          - { name: name, label: Nome, widget: string }
          - { name: tagline, label: Sottotitolo, widget: string }
          - { name: bio, label: Bio (pagina Info), widget: text }
          - name: clients
            label: Worked on (clienti)
            widget: list
            field: { name: item, label: Voce, widget: string }
          - name: disciplines
            label: Discipline
            widget: list
            field: { name: item, label: Voce, widget: string }
          - { name: availability, label: Disponibilità, widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false }
          - { name: instagram, label: Instagram (nome utente), widget: string, required: false }
          - { name: seo_title, label: Titolo SEO (tab del browser e Google), widget: string }
          - { name: seo_description, label: Descrizione SEO, widget: text }
          - name: share_image
            label: Immagine anteprima social (1200×630)
            widget: image
            required: false
